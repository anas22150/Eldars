name: Build Abla APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unpack project and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Abla-Month-Settings-Upgrade.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على $ZIP_FILE في جذر المستودع."
            echo "ارفع ملف ZIP بجوار مجلد .github."
            exit 1
          fi

          mkdir -p _abla_unpacked
          unzip -oq "$ZIP_FILE" -d _abla_unpacked

          # يدعم ZIP الذي يحتوي الملفات مباشرة أو داخل مجلد رئيسي واحد.
          if [ -f "_abla_unpacked/main.py" ] && [ -f "_abla_unpacked/pyproject.toml" ]; then
            PROJECT_DIR="_abla_unpacked"
          else
            PROJECT_DIR="$(find _abla_unpacked -type f -name pyproject.toml -print -quit | xargs -r dirname)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/main.py" ]; then
            echo "::error::لم أجد main.py بجوار pyproject.toml داخل الملف المضغوط."
            find _abla_unpacked -maxdepth 4 -type f | head -80
            exit 1
          fi

          # انسخ ملفات المشروع إلى جذر المستودع حتى يجدها Flet.
          cp -a "$PROJECT_DIR"/. .
          echo "تم فك الضغط. ملفات المشروع:"
          ls -la
          test -f main.py
          test -f pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Verify Environment
        run: |
          python --version
          flutter --version
          flet --version

      - name: Check Python Files
        run: python -m py_compile main.py database.py utils.py pdf_generator.py

      - name: Build APK
        run: flet build apk --verbose --yes --arch arm64-v8a

      - name: Verify APK
        run: |
          APK="$(find build -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::لم يتم العثور على APK بعد البناء."
            exit 1
          fi
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abla-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
